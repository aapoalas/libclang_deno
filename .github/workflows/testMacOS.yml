name: Testing LLVM on MacOS

on:
  push:
    branches: ["testing", "main"]
    paths:
      - ".github/workflows/testMacOS.yml"
      - "build/**"
      - "lib/**"
      - "test/**"
  pull_request:
    branches: ["testing", "main"]
    paths:
      - ".github/workflows/testMacOS.yml"
      - "build/**"
      - "lib/**"
      - "test/**"

jobs:
  build:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v3
      - uses: denoland/setup-deno@v1
        with:
          deno-version: 2.4.1
      - name: install llvm@20
        run: brew install llvm@20
      - name: test
        run: |
          export LIBCLANG_PATH="$(brew --prefix llvm@20)/lib"
          export TEST_DIR=$LIBCLANG_PATH
          export TEST_PATH="$TEST_DIR/libclang.dylib"
          deno task test
