name: Testing LLVM on Ubuntu

on:
  push:
    branches: ["testing", "main", "deno.json"]
    paths:
      - ".github/workflows/testUbuntu.yml"
      - "build/**"
      - "lib/**"
      - "test/**"
  pull_request:
    branches: ["testing", "main", "deno.json"]
    paths:
      - ".github/workflows/testUbuntu.yml"
      - "build/**"
      - "lib/**"
      - "test/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: denoland/setup-deno@v1
        with:
          deno-version: 2.4.1

      - name: Uninstall old LLVM
        run: |
          sudo apt-get remove -y libclang*

      - name: Install LLVM
        run: |
          sudo apt-get install -y libclang1-19

      - name: test
        run: |
          export LIBCLANG_PATH=/usr/lib/llvm-19/lib
          export TEST_DIR=$LIBCLANG_PATH
          export TEST_PATH=$TEST_DIR/libclang-19.so.1
          deno task test
